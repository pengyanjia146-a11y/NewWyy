name: 🛠️ Fix Project Structure

on:
  push:
  workflow_dispatch:

jobs:
  fix-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 读写权限，用于移动文件
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Find Code & Move to Root
        run: |
          echo "🔍 Searching for package.json..."
          
          # 1. 查找 package.json (排除 node_modules)
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PKG_PATH" ]; then
            echo "❌ Error: 找不到 package.json！请确认你是否上传了代码。"
            # 列出当前所有文件帮助排查
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          echo "✅ Found package.json at: $PKG_PATH"
          
          # 获取文件所在的目录
          PKG_DIR=$(dirname "$PKG_PATH")

          # 2. 判断是否在根目录
          if [ "$PKG_DIR" == "." ]; then
            echo "🎉 Good news! Code is already at the root. No action needed."
            echo "✅ 你现在可以直接去运行 Build Debug APK 了！"
          else
            echo "🚚 Moving files from '$PKG_DIR' to root..."
            
            # 创建临时目录防止冲突
            mkdir -p temp_root
            
            # 把源码移动到临时目录
            # 注意：这里使用 rsync 或 mv 的策略来移动
            cp -r "$PKG_DIR"/* temp_root/
            cp -r "$PKG_DIR"/.* temp_root/ 2>/dev/null || true
            
            # 清空当前目录 (除了 .git 和 temp_root)
            find . -maxdepth 1 -not -name 'temp_root' -not -name '.git' -not -name '.' -exec rm -rf {} +
            
            # 从临时目录移回来
            mv temp_root/* .
            mv temp_root/.* . 2>/dev/null || true
            rmdir temp_root
            
            echo "✅ Move completed. Code is now at repository root."
          fi

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit."
          else
            git commit -m "chore: Move code to root directory [skip ci]"
            git push
            echo "🚀 File structure fixed!"
          fi
