name: 🛠️ Smart Unzip (Auto-Find)

on:
  push:
  workflow_dispatch:

jobs:
  find-and-unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Find and Unzip
        run: |
          # 1. 自动查找仓库里唯一的 zip 文件
          echo "📂 Searching for zip files..."
          # 查找所有 .zip 文件，忽略 .git 目录
          ZIP_FILE=$(find . -name "*.zip" -not -path "*/.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Fatal Error: No .zip file found in the repository!"
            echo "👇 Current file structure:"
            ls -R
            exit 1  # 这次找不到会直接报错红色，方便你知道
          fi

          echo "✅ Found zip file: $ZIP_FILE"

          # 2. 解压
          unzip -o "$ZIP_FILE" -d .
          echo "🎉 Unzip finished."
          
          # 3. 智能移动：如果解压出来是在一个子文件夹里（比如 xxx-source/package.json）
          # 我们自动把它里面的东西移出来，确保 package.json 在根目录
          if [ ! -f "package.json" ]; then
             echo "⚠️ package.json not in root. Searching..."
             # 找 package.json 在哪
             PKG_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
             
             if [ ! -z "$PKG_DIR" ] && [ "$PKG_DIR" != "." ]; then
               echo "🚚 Moving files from '$PKG_DIR' to root..."
               # 移动所有文件到根目录
               cp -r "$PKG_DIR"/* .
               cp -r "$PKG_DIR"/.* . 2>/dev/null || true
               # 删除原来的空文件夹
               rm -rf "$PKG_DIR"
             fi
          fi

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit. (Files might already exist)"
          else
            git commit -m "chore: Auto-unzip source code"
            git push
            echo "🚀 Done! Source code is now in the repository."
          fi
