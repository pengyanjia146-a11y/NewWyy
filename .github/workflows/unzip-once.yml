name: 🛠️ Unzip Source Once

on:
  # 🟢 修改点：只要有代码提交 (push)，就自动运行！
  push:
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须有写入权限
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip File
        run: |
          # 🟢 确保这里的名字和你上传的压缩包一模一样！
          ZIP_NAME="NewWyy/NewWyy-source.zip"

          if [ -f "$ZIP_NAME" ]; then
            echo "✅ Found zip file: $ZIP_NAME"
            unzip -o "$ZIP_NAME" -d .
            echo "🎉 Unzip finished."
          else
            echo "❌ Error: File $ZIP_NAME not found!"
            # 这里的 exit 0 是为了防止报错红叉，如果没找到文件就算了
            exit 0 
          fi

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit."
          else
            git commit -m "chore: Auto-unzip [skip ci]"
            git push
            echo "🚀 Successfully pushed files!"
          fi
