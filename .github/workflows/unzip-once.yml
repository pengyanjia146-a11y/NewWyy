name: 🛠️ Unzip Source Once

on:
  push:
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 读写权限
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip File
        run: |
          # 确保文件名和你上传的一致
          ZIP_NAME="NewWyy/NewWyy-source.zip"

          if [ -f "$ZIP_NAME" ]; then
            echo "✅ Found zip file: $ZIP_NAME"
            unzip -o "$ZIP_NAME" -d .
            echo "🎉 Unzip finished."
          else
            echo "❌ Error: File $ZIP_NAME not found!"
            # 没找到文件不报错，避免红叉，方便排查
            exit 0 
          fi

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit."
          else
            # 🟢 关键修改：去掉了 [skip ci]，这样提交后会自动触发 Build 流程
            git commit -m "chore: Auto-unzip source code"
            git push
            echo "🚀 Successfully pushed files! Build should start automatically."
          fi
