name: Build Android APK (Universal Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        # 增加参数防止因网络抖动或权限导致的 254 错误
        run: npm install --no-audit --progress=false

      - name: Build Web Assets
        # 增加内存限制，防止 Vite 在 Actions 中由于资源限制退出 (Code 1)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx vite build

      - name: Capacitor Sync
        run: |
          # 修正：绝不能执行 rm -rf android
          # sync 会自动处理 web 资源拷贝和插件链接
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # 使用 gradle-build-action 提供的缓存机制进行构建
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewWyy-Debug-Build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Sign & Build Release APK (Optional)
        # 仅当你配置了 GitHub Secrets 才会运行
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NewWyy-Release-Signed
          path: android/app/build/outputs/apk/release/*.apk
