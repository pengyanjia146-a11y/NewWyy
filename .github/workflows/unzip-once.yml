name: 🛠️ Unzip Source Once (One-Time Tool)

# 触发方式：只有手动点击按钮才会运行
on:
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      # 必须给予写入权限，否则无法提交代码回仓库
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip File
        run: |
          # 🟢 设置你的压缩包名字 (请确认名字是否正确！)
          ZIP_NAME="NewWyy/NewWyy-source.zip"

          if [ -f "$ZIP_NAME" ]; then
            echo "✅ Found zip file: $ZIP_NAME"
            
            # 解压到当前目录 (-o 覆盖, -d . 当前目录)
            unzip -o "$ZIP_NAME" -d .
            
            # 删除压缩包 (可选：如果你解压后不想要压缩包了，取消下面这行的注释)
            # rm "$ZIP_NAME"
            
            echo "🎉 Unzip finished."
          else
            echo "❌ Error: File $ZIP_NAME not found!"
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          # 配置 Git 身份
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # 添加所有新文件
          git add .
          
          # 检查是否有文件发生了变化
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit. (Maybe already unzipped?)"
          else
            # 提交并推送到当前分支
            git commit -m "chore: Auto-unzip source code [skip ci]"
            git push
            echo "🚀 Successfully pushed unzipped files to repository!"
          fi
