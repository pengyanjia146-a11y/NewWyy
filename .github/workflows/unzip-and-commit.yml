name: Unzip and commit

on:
  workflow_dispatch:
  push:
    paths:
      - 'NewWyy_SourceCode.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure unzip installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: List repo root
        run: ls -la

      - name: Unzip archive
        run: |
          unzip -o NewWyy_SourceCode.zip -d extracted
          ls -la extracted | sed -n '1,200p'

      - name: Copy extracted into repo
        run: |
          rsync -a --delete extracted/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add source from zip (automated)"
            git push
          fi
