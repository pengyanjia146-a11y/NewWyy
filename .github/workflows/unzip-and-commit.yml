name: Unzip and commit

on:
  workflow_dispatch:
  push:
    paths:
      - 'NewWyy_SourceCode.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y unzip rsync
      - run: |
          unzip -o NewWyy_SourceCode.zip -d extracted
          rsync -a --delete extracted/ ./
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add source from zip (automated)"
            git push
          fi
