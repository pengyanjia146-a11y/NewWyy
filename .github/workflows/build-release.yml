name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npx vite build

      - name: Capacitor Sync
        run: |
          # 核心修复：不再删除 android 目录，仅同步代码和插件
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.6' # 匹配项目所需版本

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # 使用 assembleDebug 快速验证，或改为 assembleRelease
          ./gradlew assembleDebug

      - name: Sign APK (Optional)
        # 仅当配置了密钥时执行，防止 exit code 254
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo ${{ secrets.KEYSTORE_BASE64 }} | base64 -d > release.keystore
          # 此处调用 build-tools 进行签名逻辑

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewWyy-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
