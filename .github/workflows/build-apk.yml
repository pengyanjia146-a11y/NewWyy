name: Build Debug APK (Auto Version)

on:
  push:
    # 这里的修改允许在所有分支上触发构建
    branches:
      - '**' 
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # 1. 自动生成宽松的 TS 配置并构建网页版 (跳过严格类型检查以防报错导致打包失败)
      - name: Fix TS Config & Build
        run: |
          echo '{
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": false,            
              "noImplicitAny": false,     
              "noUnusedLocals": false,
              "noUnusedParameters": false,
              "noFallthroughCasesInSwitch": true
            },
            "include": ["."], 
            "exclude": ["node_modules", "dist", "android", "vite.config.ts", "server.js"]
          }' > tsconfig.json
          
          # 开始构建网页资源
          npm run build

      # 2. 初始化并同步 Capacitor 安卓环境
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 如果项目中没有 android 目录则自动创建
          if [ ! -d "android" ]; then
            echo "Android folder not found. Creating..."
            npx cap add android
          fi
          
          # 同步网页资源到安卓原生项目
          npx cap copy android
          npx cap sync android

      # 3. 核心步骤：根据 GitHub 运行次数自动修改版本号 (防止安装包冲突)
      - name: Bump Android Version
        run: |
          echo "🚀 Bump version to 1.0.0.${{ github.run_number }}"
          cd android/app
          
          # 修改 build.gradle 中的 versionCode 和 versionName
          sed -i 's/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g' build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.0.${{ github.run_number }}"/g' build.gradle

      # 4. 构建 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. 上传 APK 产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          # 文件名会包含版本号，例如 UniStream-v1.0.0.45
          name: UniStream-v1.0.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
