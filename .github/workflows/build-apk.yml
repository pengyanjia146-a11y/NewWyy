name: Build Debug APK (Auto Version)

on:
  push:
    branches:
      - '**' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # 1. 彻底隔离备份文件夹，防止语法错误阻断构建
      - name: Fix TS Config & Build
        run: |
          echo '{
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": false
            },
            "include": ["src", "services", "components", "types.ts", "App.tsx", "index.tsx"], 
            "exclude": ["node_modules", "dist", "android", "saved_sources", "server.js"]
          }' > tsconfig.json
          
          npm run build

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap copy android
          npx cap sync android

      - name: Bump Android Version
        run: |
          cd android/app
          sed -i 's/versionCode [0-9]\+/versionCode ${{ github.run_number }}/g' build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.0.${{ github.run_number }}"/g' build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniStream-v1.0.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
